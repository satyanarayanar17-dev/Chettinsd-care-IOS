name: ChettinadCare-iOS
options:
  bundleIdPrefix: com.chettinadcare
  createTestSchemes: true
  deploymentTarget:
    iOS: 16.0
    macOS: 13.0
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 47797T9SLZ
    CC_PILOT_ENDPOINT_APPROVED: NO
targets:
  ChettinadCore:
    type: framework
    platform: iOS
    sources: [ChettinadCore]
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: YES

  ChettinadCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChettinadCoreTests]
    dependencies:
      - target: ChettinadCore
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: YES

  ChettinadCarePatient:
    type: application
    platform: iOS
    sources: [ChettinadCarePatient, SharedResources]
    preBuildScripts:
      - name: Validate backend environment
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/swift -sdk "$(/usr/bin/xcrun --sdk macosx --show-sdk-path)" "$SRCROOT/scripts/validate-environment.swift"
    info:
      path: ChettinadCarePatient/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to the Chettinad Care backend."
        CC_API_BASE_URL: "$(CC_API_BASE_URL)"
        APP_ENV: "$(APP_ENV)"
        CFBundleDisplayName: "$(CC_APP_NAME)"
    dependencies:
      - target: ChettinadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chettinadcare.patient
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47797T9SLZ
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
      configs:
        Debug:
          CC_APP_NAME: "Care Demo"
          CC_API_BASE_URL: "https://chettinad-care-api.onrender.com"
          APP_ENV: "local"
        Staging:
          CC_APP_NAME: "Chettinad Care"
          CC_API_BASE_URL: "https://chettinad-pilot-api.onrender.com"
          APP_ENV: "staging"
        Release:
          CC_APP_NAME: "Chettinad Care"
          CC_API_BASE_URL: "https://chettinad-pilot-api.onrender.com"
          APP_ENV: "production"

  ChettinadCarePatientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChettinadCarePatientTests]
    dependencies:
      - target: ChettinadCarePatient
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: YES

  ChettinadCareStaff:
    type: application
    platform: iOS
    sources: [ChettinadCareStaff, SharedResources]
    preBuildScripts:
      - name: Validate backend environment
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/swift -sdk "$(/usr/bin/xcrun --sdk macosx --show-sdk-path)" "$SRCROOT/scripts/validate-environment.swift"
    info:
      path: ChettinadCareStaff/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to the Chettinad Care backend."
        CC_API_BASE_URL: "$(CC_API_BASE_URL)"
        APP_ENV: "$(APP_ENV)"
        CFBundleDisplayName: "$(CC_APP_NAME)"
    dependencies:
      - target: ChettinadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chettinadcare.staff
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47797T9SLZ
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
      configs:
        Debug:
          CC_APP_NAME: "Staff Demo"
          CC_API_BASE_URL: "https://chettinad-care-api.onrender.com"
          APP_ENV: "local"
        Staging:
          CC_APP_NAME: "Chettinad Staff"
          CC_API_BASE_URL: "https://chettinad-pilot-api.onrender.com"
          APP_ENV: "staging"
        Release:
          CC_APP_NAME: "Chettinad Staff"
          CC_API_BASE_URL: "https://chettinad-pilot-api.onrender.com"
          APP_ENV: "production"

  ChettinadCareStaffTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChettinadCareStaffTests]
    dependencies:
      - target: ChettinadCareStaff
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: 1,2,6
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: YES

  ChettinadCareStaffUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ChettinadCareStaffUITests]
    dependencies: [{target: ChettinadCareStaff}]
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DEVELOPMENT_TEAM: 47797T9SLZ
        CODE_SIGN_STYLE: Automatic
  ChettinadCarePatientUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ChettinadCarePatientUITests]
    dependencies: [{target: ChettinadCarePatient}]
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DEVELOPMENT_TEAM: 47797T9SLZ
        CODE_SIGN_STYLE: Automatic

schemes:
  ChettinadCarePatient:
    build:
      targets:
        ChettinadCarePatient: all
        ChettinadCore: all
    test:
      targets:
        - ChettinadCarePatientTests
        - ChettinadCarePatientUITests
        - ChettinadCoreTests
  ChettinadCareStaff:
    build:
      targets:
        ChettinadCareStaff: all
        ChettinadCore: all
    test:
      targets:
        - ChettinadCareStaffTests
        - ChettinadCareStaffUITests
        - ChettinadCoreTests
  ChettinadCore:
    build:
      targets:
        ChettinadCore: all
    test:
      targets:
        - ChettinadCoreTests
